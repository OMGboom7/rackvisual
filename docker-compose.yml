services:
  api:
    build: ./api
    ports:
      - "3001:3001"
    volumes:
      - ./api/src:/app/src
      - ./data:/app/data
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_PATH: /app/data/rackvisual.db
    command: npm run dev

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - api
